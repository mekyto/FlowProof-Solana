[package]
name = "flowproof"
version = "0.1.0"
description = "FlowProof on-chain invoice proofs and financing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "flowproof"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"
blake3 = "=1.5.4"
solana-program = "=2.1.21"
proc-macro-crate = "=3.2.0"
indexmap = "=2.7.0"
zeroize_derive = "=1.4.2"
unicode-segmentation = "=1.12.0"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
